<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="robots" content="noindex">
<title>Mis Cuentas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #8a8984;
  --line: #e4e3df; --blue: #2a78d6; --blue-soft: #e3eefb; --orange: #eb6834; --aqua: #1baf7a;
  --red: #c62828; --red-soft: #fdecec; --green: #1b7f4b; --green-soft: #e6f4ec;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --card: #1c1c1b; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8e88;
    --line: #2e2e2c; --blue: #3987e5; --blue-soft: #1d2b3d; --orange: #d95926; --aqua: #199e70;
    --red: #ef6b6b; --red-soft: #3a1f1f; --green: #4cc38a; --green-soft: #17301f;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
  font-variant-numeric: tabular-nums;
}
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  display: flex; align-items: center; gap: 8px;
}
header.top h1 { font-size: 20px; margin: 0; flex: 1; }
.corte-nav { display: flex; align-items: center; gap: 4px; }
.corte-nav button { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 18px; }
.corte-nav .lbl { text-align: center; min-width: 92px; }
.corte-nav .lbl b { display: block; font-size: 15px; }
.corte-nav .lbl small { color: var(--ink2); font-size: 11px; }
main { padding: 0 16px; max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin: 10px 0; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin: 0 0 10px; font-weight: 600; }
.hero { text-align: center; padding: 18px 14px; }
.hero .lab { color: var(--ink2); font-size: 13px; }
.hero .big { font-size: 34px; font-weight: 700; margin: 2px 0; }
.hero .sub { font-size: 13px; }
.neg { color: var(--red); } .pos { color: var(--green); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.kpis div { background: var(--bg); border-radius: 10px; padding: 8px 6px; }
.kpis small { display: block; color: var(--ink2); font-size: 11px; }
.kpis b { font-size: 14px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.blue { background: var(--blue-soft); color: var(--blue); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .l { color: var(--ink2); }
.row .r { font-weight: 600; text-align: right; white-space: nowrap; }
.row.total .l, .row.total .r { color: var(--ink); font-weight: 700; }
.bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 4px; display: flex; gap: 2px; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
.bar i.o { background: var(--orange); }
.bar i.a { background: var(--aqua); }
.plan-item { padding: 8px 0; }
.plan-item + .plan-item { border-top: 1px solid var(--line); }
.plan-item .t { display: flex; justify-content: space-between; gap: 8px; }
.plan-item .t b { font-weight: 600; }
.plan-item .s { color: var(--ink2); font-size: 12px; display: flex; justify-content: space-between; margin-top: 2px; }
.cat { display: grid; grid-template-columns: 110px 1fr 74px; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
.cat .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
.cat .v { text-align: right; font-weight: 600; }
.cat .track { height: 14px; }
.cat .track i { display: block; height: 100%; background: var(--blue); border-radius: 0 4px 4px 0; min-width: 2px; }
.cols { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 16px; }
.cols .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
.cols .c i { display: block; width: 100%; background: var(--blue); border-radius: 4px 4px 0 0; min-height: 1px; }
.cols .c.sel i { background: var(--orange); }
.cols .c small { font-size: 10px; color: var(--ink2); margin-top: 4px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); margin-top: 8px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.list-item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.list-item:first-child { border-top: 0; }
.list-item .m { flex: 1; min-width: 0; }
.list-item .m b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.list-item .m small { color: var(--ink2); font-size: 12px; }
.list-item .amt { text-align: right; font-weight: 600; white-space: nowrap; }
.list-item .amt small { display: block; font-weight: 400; color: var(--ink2); font-size: 11px; }
.day { font-size: 12px; color: var(--muted); margin: 14px 0 0; font-weight: 600; }
.search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; }
.empty { text-align: center; color: var(--ink2); padding: 30px 10px; }
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button { flex: 1; background: none; border: 0; padding: 8px 0 10px; color: var(--muted); font-size: 11px; }
nav.tabs button .ic { display: block; font-size: 20px; line-height: 24px; }
nav.tabs button.on { color: var(--blue); font-weight: 600; }
.fab {
  position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 11;
  height: 56px; padding: 0 22px; border-radius: 28px; border: 0; background: var(--blue); color: #fff;
  font-size: 17px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.quick button { padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; font-weight: 600; }
.quick button.p { background: var(--blue); color: #fff; border-color: var(--blue); }
/* Hoja de formulario */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
.sheet-bg.open { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 18px 18px 0 0;
  max-height: 92vh; overflow-y: auto; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  transform: translateY(105%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; max-width: 640px; margin: 0 auto;
}
.sheet.open { transform: none; visibility: visible; transition: transform .2s ease; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
.sheet h3 { margin: 0 0 12px; font-size: 18px; }
.amount { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.amount input { flex: 1; font-size: 32px; font-weight: 700; border: 0; border-bottom: 2px solid var(--blue); background: transparent; color: var(--ink); padding: 4px 0; width: 100%; min-width: 0; }
.amount input:focus { outline: none; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; }
.seg button.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.field { margin: 12px 0; }
.field > label { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 5px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px; font-family: inherit;
}
.field textarea { min-height: 90px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 12px; color: var(--ink2); margin-top: 4px; }
details.more summary { color: var(--blue); font-size: 14px; padding: 8px 0; cursor: pointer; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
.btn { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px; font-weight: 600; }
.btn.p { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.d { color: var(--red); flex: 0 0 auto; }
.btn.block { display: block; width: 100%; margin: 8px 0; text-align: center; }
.mini-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.mini-table td { padding: 4px 2px; }
.mini-table input, .mini-table select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
.fijo { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; }
.fijo summary { font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.banner { background: var(--blue-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 10px 0; display: flex; gap: 8px; align-items: center; }
.banner button { margin-left: auto; border: 0; background: var(--blue); color: #fff; border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Resumen</h1>
  <div class="corte-nav" id="corteNav">
    <button id="prevC" aria-label="Corte anterior">‹</button>
    <div class="lbl"><b id="corteLbl"></b><small id="corteEst"></small></div>
    <button id="nextC" aria-label="Corte siguiente">›</button>
  </div>
</header>
<main id="view"></main>
<button class="fab" id="fab">+ Gasto</button>
<nav class="tabs">
  <button data-tab="resumen" class="on"><span class="ic">◔</span>Resumen</button>
  <button data-tab="movs"><span class="ic">☰</span>Gastos</button>
  <button data-tab="pagos"><span class="ic">✓</span>Pagos</button>
  <button data-tab="ajustes"><span class="ic">⚙</span>Ajustes</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">
<script src="app.js"></script>
</body>
</html>
